services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: ../backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/guardian
      DB_USER: guardian
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY}
      APP_EMAIL_HMAC_KEY: ${APP_EMAIL_HMAC_KEY}
      APP_JWT_SIGNING_KEY: ${APP_JWT_SIGNING_KEY}
      APP_FROM_ADDRESS: ${APP_FROM_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8080"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host: the DB is reachable only on the internal network.

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Heartbeat/code state is ephemeral by design; no persistence needed.

volumes:
  caddy_data:
  caddy_config:
  pg_data:
